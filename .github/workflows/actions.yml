name: Pytest

on:
  pull_request: null
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_PLATFORMS: cpu

jobs:
  tests-float64:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Git LFS Pull
        run: git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ matrix.python-version }}-

      - name: Setup
        run: |
          uv sync --python ${{ matrix.python-version }} --group dev
          uv run setup-radas

      - name: Blanket Tests (float64)
        run: >-
          uv run pytest popsim/tests
          --ignore=popsim/tests/test_simulate.py
          --ignore=popsim/tests/test_ml
          --ignore=popsim/tests/test_modules
          --ignore=popsim/tests/test_interfaces
          --ignore=popsim/tests/test_physics
          -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: Simulate Tests (float64)
        run: uv run pytest popsim/tests/test_simulate.py -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: ML Tests (float64)
        run: uv run pytest popsim/tests/test_ml/ -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: Modules Tests (float64)
        run: uv run pytest popsim/tests/test_modules/ -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: Interfaces Tests (float64)
        run: uv run pytest popsim/tests/test_interfaces/ -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: Physics Tests (float64)
        run: uv run pytest popsim/tests/test_physics/ -n=auto
        env:
          JAX_ENABLE_X64: True

  tests-float32:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Git LFS Pull
        run: git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ matrix.python-version }}-

      - name: Setup
        run: |
          uv sync --python ${{ matrix.python-version }} --group dev
          uv run setup-radas

      # test_physics is intentionally not run in float32 because it is very slow
      # test_modules is intentionally not run in float32 because some modules require float64
      # (test_lti scan carry dtype mismatch, test_td_popcon physics results exceed tolerance)
      - name: Blanket Tests (float32)
        run: >-
          uv run pytest popsim/tests
          --ignore=popsim/tests/test_simulate.py
          --ignore=popsim/tests/test_ml
          --ignore=popsim/tests/test_modules
          --ignore=popsim/tests/test_interfaces
          --ignore=popsim/tests/test_physics
          -n=auto
        env:
          JAX_ENABLE_X64: False

      - name: Simulate Tests (float32)
        run: uv run pytest popsim/tests/test_simulate.py -n=auto
        env:
          JAX_ENABLE_X64: False

      - name: ML Tests (float32)
        run: uv run pytest popsim/tests/test_ml/ -n=auto
        env:
          JAX_ENABLE_X64: False

      - name: Interfaces Tests (float32)
        run: uv run pytest popsim/tests/test_interfaces/ -n=auto
        env:
          JAX_ENABLE_X64: False

  cfspopcon-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Git LFS Pull
        run: git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ matrix.python-version }}-

      - name: Setup
        run: |
          uv sync --python ${{ matrix.python-version }} --group dev
          uv run setup-radas

      - name: CFSPOPCON jax_compatible Tests
        run: uv run pytest ./popsim/cfspopcon_jax/tests/ -n=auto
        timeout-minutes: 160
        env:
          JAX_ENABLE_X64: True

  notebook-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Git LFS Pull
        run: git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ matrix.python-version }}-

      - name: Setup
        run: |
          uv sync --python ${{ matrix.python-version }} --group dev
          uv run setup-radas

      - name: Test Top-Level Notebooks
        run: uv run pytest --nbmake docs/notebooks/*.ipynb -n=auto --nbmake-timeout=300 --reruns 5 --reruns-delay 1
        timeout-minutes: 60
        env:
          JAX_ENABLE_X64: True

      - name: Test Module Notebooks
        run: uv run pytest --nbmake docs/notebooks/modules/ -n=auto --nbmake-timeout=300 --reruns 5 --reruns-delay 1
        timeout-minutes: 60
        env:
          JAX_ENABLE_X64: True
