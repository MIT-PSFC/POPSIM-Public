name: Pytest

on:
  pull_request: []
  push:
    branches:
      - "main"
  workflow_dispatch:
    tag: "Manual run"

env:
  JAX_PLATFORMS: cpu

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        os:
          [
            "runs-on,runner=8cpu-linux-x64,run-id=${{ github.run_id }}",
            "macos-latest",
          ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"
          token: ${{ secrets.POPSIM_PAT }}

      - name: Git LFS Pull
        run: git lfs pull

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python - --version 1.6.1

      - name: MacOS PATH
        if: ${{matrix.os}} == 'macos-latest'
        run: echo "/Users/runner/.local/bin" >> $GITHUB_PATH

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: Setup
        run: poetry install; poetry run setup-radas

      - name: Tests
        # TODO enable -Werror once tests are fixed
        run: poetry run pytest popsim/tests -n=auto

      - name: CFSPOPCON jax_compatible Tests
        run: poetry run pytest ./popsim/cfspopcon_jax/tests/ -n=auto

      - name: Test Notebooks
        run: poetry run pytest --nbmake docs/notebooks/ -n=auto -k 'not docs/notebooks/doc_ignore/'