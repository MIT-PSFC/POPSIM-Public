name: Pytest

on:
  pull_request: []
  push:
    branches:
      - "main"
  workflow_dispatch:
    tag: "Manual run"

env:
  JAX_PLATFORMS: cpu

jobs:
  radas:
    runs-on: runs-on,runner=8cpu-linux-x64,run-id=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"
          token: ${{ secrets.POPSIM_PAT }}

      - name: Git LFS Pull
        run: git lfs pull

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Need to push to GH & runson. But runs-on cache will be able to fallback read from GH
      - name: Cache radas results to GitHub
        id: radas-gh
        uses: actions/cache@v4
        with:
          path: popsim/atomic_data
          key: radas-${{ hashFiles('.github/workflows/build_radas.sh')}}

      - name: Cache radas results to runson
        id: radas
        uses: runs-on/cache@v4
        with:
          path: popsim/atomic_data
          key: radas-${{ hashFiles('.github/workflows/build_radas.sh')}}

      - name: Make radas data
        if: (steps.radas.outputs.cache-hit != 'true') && (steps.radas-gh.outputs.cache-hit != 'true')
        run: bash .github/workflows/build_radas.sh

  build:
    needs: radas
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        os:
          [
            "runs-on,runner=8cpu-linux-x64,run-id=${{ github.run_id }}",
            "macos-latest",
          ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"
          token: ${{ secrets.POPSIM_PAT }}

      - name: Git LFS Pull
        run: git lfs pull

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python - --version 1.6.1

      - name: MacOS PATH
        if: ${{matrix.os}} == 'macos-latest'
        run: echo "/Users/runner/.local/bin" >> $GITHUB_PATH

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"

      - name: Setup
        run: poetry install

      - uses: runs-on/cache/restore@v4
        id: radas
        with:
          path: popsim/atomic_data
          key: radas-${{ hashFiles('.github/workflows/build_radas.sh')}}

      - name: Check cache hit
        if: steps.radas.outputs.cache-hit != 'true'
        run: exit 1

      - name: Copy radas data
        run: cp popsim/atomic_data/*.nc ./submodules/cfspopcon/cfspopcon/atomic_data/

      - name: Tests
        # TODO enable -Werror once tests are fixed
        run: poetry run pytest popsim/tests -n=auto

      - name: CFSPOPCON jax_compatible Tests
        run: poetry run pytest ./submodules/cfspopcon/cfspopcon/jax_compatible/tests/ -n=auto

      - name: Test Notebooks
        run: poetry run pytest --nbmake docs/notebooks/ -n=auto -k 'not docs/notebooks/doc_ignore/' --nbmake-timeout=600