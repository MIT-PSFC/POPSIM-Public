name: Pytest

on:
  pull_request: null
  push:
    branches:
      - "main"

env:
  JAX_PLATFORMS: cpu

jobs:
  tests-float64:
    runs-on: runs-on,runner=4cpu-linux-x64,run-id=${{ github.run_id }},extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Git LFS Pull
        run: git lfs pull

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python with uv
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ matrix.python-version }}-

      - name: Setup
        run: uv sync --group dev; uv run setup-radas

      - name: Blanket Tests (float64)
        run: >-
          uv run pytest popsim/tests
          --ignore=popsim/tests/test_simulate.py
          --ignore=popsim/tests/test_ml
          --ignore=popsim/tests/test_modules
          --ignore=popsim/tests/test_interfaces
          --ignore=popsim/tests/test_physics
          -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: Simulate Tests (float64)
        run: uv run pytest popsim/tests/test_simulate.py -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: ML Tests (float64)
        run: uv run pytest popsim/tests/test_ml/ -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: Modules Tests (float64)
        run: uv run pytest popsim/tests/test_modules/ -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: Interfaces Tests (float64)
        run: uv run pytest popsim/tests/test_interfaces/ -n=auto
        env:
          JAX_ENABLE_X64: True

      - name: Physics Tests (float64)
        run: uv run pytest popsim/tests/test_physics/ -n=auto
        env:
          JAX_ENABLE_X64: True

  tests-float32:
    runs-on: runs-on,runner=4cpu-linux-x64,run-id=${{ github.run_id }},extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Git LFS Pull
        run: git lfs pull

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python with uv
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv--${{ matrix.python-version }}-

      - name: Setup
        run: uv sync --group dev; uv run setup-radas

      - name: Core Utils Tests (float32)
        # Run precision-sensitive core tests in float32 mode
        run: uv run pytest popsim/tests/test_*.py --ignore=popsim/tests/test_simulate.py -n=auto
        env:
          JAX_ENABLE_X64: False

      - name: Simulate Tests (float32)
        run: uv run pytest popsim/tests/test_simulate.py -n=auto
        env:
          JAX_ENABLE_X64: False

      - name: ML Tests (float32)
        run: uv run pytest popsim/tests/test_ml/ -n=auto
        env:
          JAX_ENABLE_X64: False

  cfspopcon-tests:
    runs-on: runs-on,runner=4cpu-linux-x64,run-id=${{ github.run_id }},extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Git LFS Pull
        run: git lfs pull

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python with uv
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv--${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv--${{ matrix.python-version }}-

      - name: Setup
        run: uv sync --group dev; uv run setup-radas

      - name: CFSPOPCON jax_compatible Tests
        run: uv run pytest ./popsim/cfspopcon_jax/tests/ -n=auto
        timeout-minutes: 160
        env:
          JAX_ENABLE_X64: True

  notebook-tests:
    runs-on: runs-on,runner=4cpu-linux-x64,run-id=${{ github.run_id }},extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"

      - name: Git LFS Pull
        run: git lfs pull

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python with uv
        run: uv python install ${{ matrix.python-version }}

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ matrix.python-version }}-

      - name: Setup
        run: uv sync --group dev; uv run setup-radas

      - name: Test Top-Level Notebooks
        run: uv run pytest --nbmake docs/notebooks/*.ipynb -n=auto --nbmake-timeout=300 --reruns 5 --reruns-delay 1
        timeout-minutes: 60
        env:
          JAX_ENABLE_X64: True

      - name: Test Module Notebooks
        run: uv run pytest --nbmake docs/notebooks/modules/ -n=auto --nbmake-timeout=300 --reruns 5 --reruns-delay 1
        timeout-minutes: 60
        env:
          JAX_ENABLE_X64: True
