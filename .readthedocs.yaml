version: 2

submodules:
  include: all
  recursive: true

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.10"
  jobs:
    post_create_environment:
      # Install poetry with specific version to avoid dependency conflicts
      # https://python-poetry.org/docs/#installing-manually
      - pip install poetry==1.8.3
    post_install:
      # VIRTUAL_ENV needs to be set manually for now.
      # See https://github.com/readthedocs/readthedocs.org/pull/11152/
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --with dev --no-root

mkdocs:
  configuration: mkdocs.yml