version: 2

submodules:
  include: all
  recursive: true

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  jobs:
    post_install:
      # Install poetry
      # https://python-poetry.org/docs/#installing-manually
      - $READTHEDOCS_VIRTUALENV_PATH/bin/pip install poetry
      # We got a lot of distlib missing errors, so explicitly install it.
      - $READTHEDOCS_VIRTUALENV_PATH/bin/pip install distlib
      # Install dependencies with 'dev' dependency group  
      # VIRTUAL_ENV needs to be set manually for now.
      # See https://github.com/readthedocs/readthedocs.org/pull/11152/
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --with dev

mkdocs:
  configuration: mkdocs.yml