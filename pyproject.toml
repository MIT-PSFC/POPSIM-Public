[project]
name = "popsim"
version = "0.1.0"
description = ""
authors = [{ name = "Allen Wang", email = "allenw@mit.edu" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "diffrax>=0.7.0,<0.8",
    "equinox>=0.13.1,<0.14",
    "jax>=0.7.2,<0.8",
    "interpax>=0.3.4,<0.4",
    "chex>=0.1.84,<0.2",
    "hvplot>=0.9.2,<0.10",
    "panel==1.3.8",
    "jupyter-bokeh>=4.0.1,<5",
    "scipy>=1.13.0,<2",
    "loguru>=0.7.2,<0.8",
    "optax>=0.2.3,<0.3",
    "orbax-checkpoint>=0.11.25,<0.12",
    "xbatcher>=0.3.0,<0.4",
    "flox>=0.9.9,<0.10",
    "bottleneck>=1.4.0,<2",
    "plotly>=5.24.1,<6",
    "tabulate>=0.9.0,<0.10",
    "xarray_jax",
    "cfspopcon>=7.0.2,<8",
    "certifi>=2024.8.30,<2025",
    "xeofs>=3.0.4,<4",
    "zarr>=2.18.3,<3",
    "omas>=0.94.1,<0.95",
    "ipdb>=0.13.13,<0.14",
    "pydantic>=2.11.5,<3",
    "fire>=0.7.1,<0.8",
    "xxhash>=3.5.0",
    "h5netcdf>=1.6.4",
]

[project.scripts]
setup-radas = "popsim.cfspopcon_jax.setup_radas:run_radas"

[dependency-groups]
dev = [
    "pytest>=8.4.0,<8.5",
    "ruff>=0.1.5,<0.2",
    "pre-commit>=3.5.0,<4",
    "jupyter>=1.0.0,<2",
    "pytest-cov>=4.1.0,<5",
    "nbmake>=1.5.5,<2",
    "pytest-xdist>=3.6.1,<4",
    "mkdocs>=1.6.0,<2",
    "pymdown-extensions~=10.9",
    "mkdocstrings>=0.26.2,<0.27",
    "mknotebooks>=0.8.0,<0.9",
    "mkdocs-material>=9.5.30,<10",
    "mkdocs-include-exclude-files>=0.0.1,<0.0.2",
    "black>=24.8.0,<25",
    "mkdocstrings-python>=1.12.1,<2",
    "pytest-repeat>=0.9.4",
    "pytest-rerunfailures>=16.0.1",
]
data = ["disruption_py"]
gpu = ["jax[cuda12]>=0.7.0,<0.8"]
# For ORCD cluster: uses system CUDA 12.4 libraries instead of pip nvidia packages
gpu-orcd = [
    "jax-cuda12-plugin==0.7.2",
    "jax-cuda12-pjrt==0.7.2",
]

[tool.uv]

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
xarray_jax = { git = "https://github.com/allen-adastra/xarray_jax.git", rev = "a857c610134d195d975dbc43be72c8c661714ced" }
disruption_py = { git = "https://github.com/MIT-PSFC/disruption-py.git", rev = "zk/popsim" }

[tool.hatch.build.targets.sdist]
include = ["popsim"]

[tool.hatch.build.targets.wheel]
include = ["popsim"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
fix = true
lint.select = [
  "A", # avoid shadowing
  "B", # flake8-bugbear
  "C4", # comprehensions 
  "E", # pycodestyle Errors
  "ERA", # no commented out code
  "F", # pyflakes
  "FLY", # flynt
  "I001", # isort
  "ISC", # implicit string concatenation
  "PERF", # Perflint
  "PIE", # flake8-pie
  "PGH", # pygrep-hooks
  "PL", # pylint
  "Q", # flake8-quotes
  "RUF", # ruff builtins e.g. noqa checking
  "T10", # flake8-debugger (no breakpoint etc)
  "TCH",# type-checking imports
  "UP", # pyupgrade
  "W", # pycodestyle warnings
  ]

lint.ignore = [
  "E501", # Never enforce line length violations, we have black for that.
  "PLR0913", #ignore limit on number of args
  "PLR2004", #ignore magic values warning, at least for now
  "C408", # use {} instead of dict(), but we use dict heavily, for now leave it
  "F722", # Incompatible with jaxtyping
  "E402", # False alarms on autoreload magic in Jupyter Notebooks.
  "PLC0415", # It is helpful to do function level imports for optional deps.
]

lint.pyupgrade.keep-runtime-typing=true
lint.pydocstyle.convention = "google"

extend-exclude = ["submodules", "tests"]
target-version = "py311"
line-length = 140

[tool.ruff.lint.pylint]
max-statements = 75
