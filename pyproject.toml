[project]
name = "popsim"
version = "0.2.0"
description = "Framework for developing control-oriented dynamics models in JAX"
authors = [{ name = "Allen Wang", email = "allenw@mit.edu" }]
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = [
    "diffrax>=0.7.2,<0.8",
    "equinox>=0.13.8,<0.14",
    "jax>=0.10.0,<0.12",
    "interpax>=0.3.14,<0.4",
    "chex>=0.1.92,<0.2",
    "hvplot>=0.12.2,<0.13",
    "panel>=1.9.3,<2",
    "scipy>=1.18.0,<2",
    "loguru>=0.7.3,<0.8",
    "optax>=0.2.8,<0.3",
    "orbax-checkpoint>=0.12.2,<0.13",
    "xbatcher>=0.4.0,<0.5",
    "flox>=0.11.2,<0.12",
    "bottleneck>=1.6.0,<2",
    "tabulate>=0.10.0,<0.11",
    "gdm-xarray-jax",
    "cfspopcon>=8.0.0,<9",
    "certifi>=2026.7.22",
    "xeofs>=3.0.4,<4",
    "zarr>=3.3.0,<4",
    "pydantic>=2.13,<3",
    "fire>=0.7.1,<0.8",
    "h5netcdf>=1.8.1",
    "xarray>=2026.2.0",
    "numpy>=2.4.4,<3",
    "jaxtyping>=0.3.11",
    "pandas>=3.0.2,<4",
    "matplotlib>=3.10",
    "holoviews>=1.19",
]

[project.optional-dependencies]
torax = ["torax==1.4.3"]

[project.scripts]
setup-radas = "popsim.cfspopcon_jax.setup_radas:run_radas"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12",
    "pre-commit>=4",
    "jupyter>=1.0.0",
    "pytest-cov>=7",
    "nbmake>=1.5.5",
    "pytest-xdist>=3.6.1",
    "mkdocs>=1.6.0",
    "pymdown-extensions>=10.9",
    "mkdocstrings>=0.26.2",
    "mknotebooks>=0.8.0",
    "mkdocs-material>=9.5.30",
    "mkdocs-include-exclude-files>=0.0.1",
    "black>=25",
    "mkdocstrings-python>=1.12.1",
    "pytest-repeat>=0.9.4",
    "pytest-rerunfailures>=16.0.1",
    "wandb>=0.25.1",
    "jupyter-bokeh>=4.1.0",
    "plotly>=6",
    "ipdb>=0.13.13",
    "git-filter-repo>=2.47.0",
]
gpu = ["jax[cuda13]>=0.10.0,<0.12"]
# For ORCD cluster: uses system CUDA 13.1 libraries instead of pip nvidia packages
gpu-orcd = [
    "jax-cuda13-plugin==0.10.2",
    "jax-cuda13-pjrt==0.10.2",
]

[tool.uv]

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
gdm-xarray-jax = { git = "https://github.com/google-deepmind/xarray_jax.git", tag = "v0.1.1" }

[tool.hatch.build.targets.sdist]
include = ["popsim"]

[tool.hatch.build.targets.wheel]
include = ["popsim"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
fix = true
lint.select = [
  "A", # avoid shadowing
  "B", # flake8-bugbear
  "C4", # comprehensions 
  "E", # pycodestyle Errors
  "ERA", # no commented out code
  "F", # pyflakes
  "FLY", # flynt
  "I001", # isort
  "ISC", # implicit string concatenation
  "PERF", # Perflint
  "PIE", # flake8-pie
  "PGH", # pygrep-hooks
  "PL", # pylint
  "Q", # flake8-quotes
  "RUF", # ruff builtins e.g. noqa checking
  "T10", # flake8-debugger (no breakpoint etc)
  "TCH",# type-checking imports
  "UP", # pyupgrade
  "W", # pycodestyle warnings
  ]

lint.ignore = [
  "E501", # Never enforce line length violations, we have black for that.
  "PLR0913", #ignore limit on number of args
  "PLR0917", #ignore limit on number of positional args, consistent with PLR0913
  "PLR2004", #ignore magic values warning, at least for now
  "C408", # use {} instead of dict(), but we use dict heavily, for now leave it
  "F722", # Incompatible with jaxtyping
  "E402", # False alarms on autoreload magic in Jupyter Notebooks.
  "PLC0415", # It is helpful to do function level imports for optional deps.
]

lint.pyupgrade.keep-runtime-typing=true
lint.pydocstyle.convention = "google"

extend-exclude = ["submodules", "tests", "*.ipynb"]
target-version = "py311"
line-length = 140

[tool.ruff.lint.pylint]
max-statements = 75
