[tool.poetry]
name = "popsim"
version = "0.1.0"
description = ""
authors = ["Allen Wang <allenw@mit.edu>"]
readme = "README.md"
packages = [{include = "popsim"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
diffrax = "^0.5.0"
equinox = "^0.11.2"
jax = "0.4.33"
cfspopcon = { path = "./submodules/cfspopcon", develop = true }
interpax = {git = "https://github.com/f0uriest/interpax.git"}
optimistix = "^0.0.6"
chex = "^0.1.84"
hvplot = "^0.9.2"
panel = "1.3.8"
jupyter-bokeh = "^4.0.1"
scipy = "^1.13.0"
loguru = "^0.7.2"
optax = "^0.2.3"
orbax-checkpoint = "^0.5.22"
xbatcher = "^0.3.0"
flox = "^0.9.9"
jax-dataloader = "^0.1.2"
bottleneck = "^1.4.0"
plotly = "^5.24.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
ruff = "^0.1.5"
pre-commit = "^3.5.0"
jupyter = "^1.0.0"
pytest-cov = "^4.1.0"
nbmake = "^1.4.6"
pytest-xdist = "^3.6.1"
mkdocs = "^1.6.0"
pymdown-extensions = "^10.9"
mkdocstrings = {extras = ["python"], version = "^0.25.2"}
mknotebooks = "^0.8.0"
mkdocs-material = "^9.5.30"
mkdocs-include-exclude-files = "^0.0.1"

[tool.poetry.group.gpu]
optional = true

[tool.poetry.group.gpu.dependencies]
jax = {version = "0.4.33", extras=["cuda12"]}


[tool.poetry.group.torax]
optional = true

[tool.poetry.group.torax.dependencies]
torax = { git = "git@github.com:google-deepmind/torax.git", rev = "0fa2a592b3757886ba62e4156912d1eaac43e41e" }


[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
fix = true
select = [
  "A", # avoid shadowing
  "B", # flake8-bugbear
  "C4", # comprehensions 
  "E", # pycodestyle Errors
  "ERA", # no commented out code
  "F", # pyflakes
  "FLY", # flynt
  "I001", # isort
  "ISC", # implicit string concatenation
  "PERF", # Perflint
  "PIE", # flake8-pie
  "PGH", # pygrep-hooks
  "PL", # pylint
  "Q", # flake8-quotes
  "RUF", # ruff builtins e.g. noqa checking
  "T10", # flake8-debugger (no breakpoint etc)
  "TCH",# type-checking imports
  "UP", # pyupgrade
  "W", # pycodestyle warnings
  ]

ignore = [
  "E501", # Never enforce line length violations, we have black for that.
  "PLR0913", #ignore limit on number of args
  "PLR2004", #ignore magic values warning, at least for now
  "C408", # use {} instead of dict(), but we use dict heavily, for now leave it
  "F722", # Incompatible with jaxtyping
  "E402", # False alarms on autoreload magic in Jupyter Notebooks.
]

exclude = [
  "submodules", # Don't apply ruff to submodules.
  "tests", # Don't apply ruff to the tests.
]

pyupgrade.keep-runtime-typing=true
pydocstyle.convention = "google"
target-version = "py39"
line-length = 140
