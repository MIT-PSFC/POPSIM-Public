type: popcon

figsize: [8, 6]
show_dpi: 150

new_coords:
  x:
    dimension: P_auxillary
    label: "$P_{RF}$ [$MW$]"
    units: MW
    max: 20.0
  y:
    dimension: average_electron_density
    label: "$<n_e>$ [$10^{20} m^{-3}$]"
    units: n20
    max: 2.4

fill:
  variable: Q
  where:
      Q:
        min: 0.9
      P_auxillary:
        min: 0.0
        max: 25.0
        units: MW


points:
  PRD:
    label: "Q1L"
    marker: "x"
    color: "red"
    size: 50.0

# Suggested colors are "tab:red", "tab:blue", "tab:orange", "tab:green", "tab:purple",
# "tab:brown", "tab:pink", "tab:gray", "tab:olive", "tab:cyan"
contour:

  Q:
    label: $Q$
    levels: [1, 1.1, 1.2]
    color: "tab:red"
    format: "1.2g"

  P_fusion:
    label: "$P_{fusion}$"
    color: "tab:purple"
    levels: [8,12,16,20,24,28]
    format: "1.2g"
  